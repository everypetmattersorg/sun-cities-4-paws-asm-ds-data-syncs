name: DaySmart to ASM Medical Notes Data Sync

# DISABLED (2026-09-11): the script's INCLUDE_TYPES filter was found to only
# match DaySmart's real "Laboratory / Diagnostics" itemType -- pharmacy/
# prescription items (dewormers, antibiotics, pain meds -- ~37% of real
# invoice items in a live check) are silently excluded, because their real
# DaySmart itemType is "Pharmacy", not "medication" as the filter checks
# for. The "dewormer"/"treatment"/"supplement"/"preventative" categories in
# INCLUDE_TYPES don't match any real DaySmart itemType at all. Scheduled
# runs are turned off until that filter is fixed and re-verified; this can
# still be run manually via workflow_dispatch (dry run) if needed. Re-add
# the `schedule:` block below to turn it back on.
on:
  workflow_dispatch:
    inputs:
      live:
        description: "Actually write to ASM (unchecked = dry run)"
        type: boolean
        default: false

jobs:
  medical-notes-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -q -r scripts/requirements.txt

      - name: Run medical notes sync
        env:
          ASM_BASE_URL: ${{ secrets.ASM_BASE_URL }}
          ASM_ACCOUNT: ${{ secrets.ASM_ACCOUNT }}
          ASM_USERNAME: ${{ secrets.ASM_USERNAME }}
          ASM_PASSWORD: ${{ secrets.ASM_PASSWORD }}
          DS_CLIENT_ID: ${{ secrets.DS_CLIENT_ID }}
          DS_CLIENT_SECRET: ${{ secrets.DS_CLIENT_SECRET }}
          DS_API_KEY: ${{ secrets.DS_API_KEY }}
          DS_DOMAIN: ${{ secrets.DS_DOMAIN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          MEDICAL_NOTES_SYNC_REPORT_TO: ${{ secrets.MEDICAL_NOTES_SYNC_REPORT_TO }}
        run: |
          # Live writes require the repo variable LIVE_MODE=true (Settings ->
          # Actions -> Variables) AND the "Medical Regimens (All Time)" ASM
          # report to exist (the script itself refuses to write live
          # without it -- see its SETUP docstring). Until then every run is
          # a dry run. A workflow_dispatch run can also force a one-off
          # live attempt via its "live" checkbox, independent of LIVE_MODE.
          if [ "${{ vars.LIVE_MODE }}" = "true" ] || [ "${{ inputs.live }}" = "true" ]; then
            python3 scripts/daysmart_to_asm_medical_notes_sync.py --live
          else
            python3 scripts/daysmart_to_asm_medical_notes_sync.py
          fi
