name: DaySmart to ASM Vaccination Data Sync

# PAUSED 2026-09-14: schedule trigger removed at the shelter's request while
# they make updates on their end (related to the ~450 pre-fix records with
# wrong DateRequired/DateExpires -- see DATE MAPPING BUG note in
# daysmart_to_asm_vaccination_sync.py). workflow_dispatch (manual, dry run
# by default) still works. Re-add the schedule block below to resume:
#   schedule:
#     - cron: "0 16 * * *"
#     - cron: "0 0 * * *"

on:
  workflow_dispatch:
    inputs:
      live:
        description: "Actually write to ASM (unchecked = dry run)"
        type: boolean
        default: false

jobs:
  vaccination-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -q -r scripts/requirements.txt

      - name: Run vaccination sync
        env:
          ASM_BASE_URL: ${{ secrets.ASM_BASE_URL }}
          ASM_ACCOUNT: ${{ secrets.ASM_ACCOUNT }}
          ASM_USERNAME: ${{ secrets.ASM_USERNAME }}
          ASM_PASSWORD: ${{ secrets.ASM_PASSWORD }}
          DS_CLIENT_ID: ${{ secrets.DS_CLIENT_ID }}
          DS_CLIENT_SECRET: ${{ secrets.DS_CLIENT_SECRET }}
          DS_API_KEY: ${{ secrets.DS_API_KEY }}
          DS_DOMAIN: ${{ secrets.DS_DOMAIN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          VACCINATION_SYNC_REPORT_TO: ${{ secrets.VACCINATION_SYNC_REPORT_TO }}
        run: |
          # Live writes require the repo variable LIVE_MODE=true (Settings ->
          # Actions -> Variables) -- set once, after dry-run reports have
          # been reviewed AND both ASM SQL reports named in the script's
          # SETUP docstring exist. Until then every run, scheduled or
          # manual, is a dry run. A workflow_dispatch run can also force a
          # one-off live run via its "live" checkbox, independent of
          # LIVE_MODE.
          if [ "${{ vars.LIVE_MODE }}" = "true" ] || [ "${{ inputs.live }}" = "true" ]; then
            python3 scripts/daysmart_to_asm_vaccination_sync.py --live
          else
            python3 scripts/daysmart_to_asm_vaccination_sync.py
          fi
